<template>
    <div class="slds-tabs_default">
        <ul class="slds-tabs_default__nav" role="tablist">
            <li class="slds-tabs_default__item" title="Flows" role="presentation">
                <a class="slds-tabs_default__link {FlowsClass}" href="javascript:void(0);" role="tab" tabindex="0"
                    data-tab="1" onclick={handleTabClick}>Flows</a>
            </li>
            <li class="slds-tabs_default__item" title="Analysis" role="presentation">
                <a class="slds-tabs_default__link {AnalysisClass}" href="javascript:void(0);" role="tab" tabindex="-1"
                    data-tab="2" onclick={handleTabClick}>Results</a>
            </li>
            <li class="slds-tabs_default__item" title="Configuration" role="presentation">
                <a class="slds-tabs_default__link {ConfigClass}" href="javascript:void(0);" role="tab" tabindex="-1"
                    data-tab="3" onclick={handleTabClick}>Configuration</a>
            </li>
            <li class="slds-tabs_default__item" title="Setup" role="presentation">
                <a class="slds-tabs_default__link {SetupClass}" href="javascript:void(0);" role="tab" tabindex="-1"
                    data-tab="4" onclick={handleTabClick}>Setup</a>
            </li>
        </ul>
        <div class="slds-tabs_default__content slds-p-around_none">
            <template if:true={isTab1Active}>
                <c-flow-overview records={records} has-more-records={hasMoreRecords} onscanflow={handleScanFlow}
                    onsearch={handleSearch} onloadmore={handleLoadMore}></c-flow-overview>
            </template>
            <template if:true={isTab2Active}>
                <c-lightning-flow-scanner name={flowName} metadata={flowMetadata} scan-result={scanResult}
                    all-scan-results={allScanResults} number-of-rules={numberOfRules} error={err} records={records}
                    selected-flow-record={selectedFlowRecord} can-fix={canFixSelectedFlow}
                    fixable-issue-count={fixableIssueCount} flow-is-active={selectedFlowIsActive}
                    onnavigateflow={handleNavigateFlow} onfixflow={handleOpenFixPreview}></c-lightning-flow-scanner>
                <template if:true={showFixPreview}>
                    <c-fix-preview flow-label={selectedFlowLabel} changes={fixChanges}
                        is-active-flow={selectedFlowIsActive} busy={isFixSaving} error={fixError}
                        status-message={fixStatusMessage} onconfirm={handleConfirmFix}
                        onclose={handleCloseFixPreview}></c-fix-preview>
                </template>
            </template>
            <template if:true={isTab3Active}>
                <c-scan-configurator rules={rulesForDisplay} onrulechange={handleRuleChange}
                    onconfigimport={handleConfigImport} onoptionchange={handleOptionChange}
                    onopenwizard={handleWizardOpen} onconfigexport={handleConfigExport}
                    onconfigreset={handleConfigReset} onconfigsave={handleConfigSave}></c-scan-configurator>
                <template if:true={showWizard}>
                    <c-config-wizard rules={rulesForDisplay} initial-rule-mode={currentRuleMode}
                        onapply={handleWizardApply} onclose={handleWizardClose}></c-config-wizard>
                </template>
            </template>
            <template if:true={isTab4Active}>
                <template if:true={setupNeeded}>
                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_warning slds-m-around_medium"
                        role="alert">
                        <div class="slds-media__body">
                            Flow Scanner couldn't authenticate with the Tooling API. Complete the steps below to finish setup.
                        </div>
                    </div>
                </template>
                <c-setup-assistant></c-setup-assistant>
            </template>
        </div>
    </div>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>
</template>
