<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="fix-preview-heading"
        class="slds-modal slds-fade-in-open slds-modal_medium">
        <div class="slds-modal__container">
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Cancel" onclick={handleCancel} disabled={busy}>
                    <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                </button>
                <h2 id="fix-preview-heading" class="slds-modal__title slds-hyphenate">
                    Fix {flowLabel}
                </h2>
                <p class="slds-m-top_x-small slds-text-body_small">{targetDescription}</p>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={hasChanges}>
                    <p class="slds-m-bottom_small">
                        These changes will be applied. Nothing else in the flow is touched.
                    </p>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="Change">Change</div></th>
                                <th scope="col"><div class="slds-truncate" title="Element">Element</div></th>
                                <th scope="col"><div class="slds-truncate" title="Rule">Rule</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={changes} for:item="change">
                                <tr key={change.id}>
                                    <td><div class="slds-truncate" title={change.action}>{change.action}</div></td>
                                    <td><div class="slds-truncate" title={change.target}>{change.target}</div></td>
                                    <td><div class="slds-truncate" title={change.ruleId}>{change.ruleId}</div></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template if:false={hasChanges}>
                    <p>Nothing on this flow can be fixed automatically.</p>
                </template>

                <template if:true={error}>
                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_error slds-m-top_medium"
                        role="alert">
                        <div class="slds-media__body">{error}</div>
                    </div>
                </template>

                <template if:true={statusMessage}>
                    <div class="slds-scoped-notification slds-media slds-media_center slds-theme_success slds-m-top_medium"
                        role="status">
                        <div class="slds-media__body">{statusMessage}</div>
                    </div>
                </template>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleCancel} disabled={busy}
                    class="slds-m-right_x-small"></lightning-button>
                <template if:true={hasChanges}>
                    <lightning-button variant="brand" label={confirmLabel} onclick={handleConfirm}
                        disabled={confirmDisabled}></lightning-button>
                </template>
            </footer>

            <template if:true={busy}>
                <lightning-spinner alternative-text="Saving" size="small"></lightning-spinner>
            </template>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
